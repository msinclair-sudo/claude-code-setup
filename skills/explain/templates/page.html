<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>{{THEME_CSS}}
main { max-width: var(--x-measure); margin: 2.5rem auto 4rem; padding: 0 1.25rem; }
main.x-wide { max-width: 1040px; }
p, li { max-width: var(--x-measure); }
h1 { margin: 0 0 .4em; } h2 { margin: 2em 0 .5em; } h3 { margin: 1.6em 0 .4em; }
.x-message { font-size: 1.15em; color: var(--x-fg); border-left: 4px solid var(--x-accent); padding: .2em 0 .2em .8em; }
figure { margin: 2em 0; }
figure img, figure svg { display: block; max-width: 100%; height: auto; }
figcaption { color: var(--x-muted); font-size: .9em; margin-top: .5em; }
.x-label { display: inline-block; font-size: .78em; letter-spacing: .02em; color: var(--x-muted);
  border: 1px solid var(--x-rule); border-radius: .25em; padding: 0 .4em; margin-right: .4em; }
table { border-collapse: collapse; margin: 1.5em 0; }
th, td { border-bottom: 1px solid var(--x-rule); padding: .35em .8em .35em 0; text-align: left; vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
code { font-family: var(--x-mono); font-size: .92em; }
.x-sources { font-size: .9em; color: var(--x-muted); border-top: 1px solid var(--x-rule); margin-top: 3em; padding-top: 1em; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main{{MAIN_CLASS}}>
{{BODY}}
</main>
</body>
</html>
