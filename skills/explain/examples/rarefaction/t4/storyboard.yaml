title: "Rarefaction in a metabarcoding experiment"
message: "A shallower sample finds fewer taxa because sequencing reads only some barcodes; rarefying to equal depth makes richness comparable but leaves every earlier bias in place."
audience: "researchers starting with microbiome metabarcoding; they know what bacteria and PCR are, not how counts get from soil to reads"
delivery: presented
tier: 4
tier_reason: "the explanation is a chain of transformations (cells, extracted DNA, gene copies, PCR, reads, a count table, subsampling), each a process that changes the counts; watching each step reshape the same bar chart shows where every distortion enters"
voice: true
numbers_ok: [1, 2, 3, 4, 5, 6, 7, 8, 16, 25, 50]
# Facts: MB-01, MB-02 literature reviews (vault Topics/Biology/Research/Results), critic blocks first.
# Pacing and wording: NP-01 (vault Apps/Research/Results) and the owner's review of 2026-10-20:
# longer pauses, a distil line ending each chapter, plain spoken sentences, "abundant" and
# "low-abundance" for counts in one sample (not "common" and "rare").
# Counts: ../pipeline.py (seed 7).
pacing: {segment: 2.0, distil: 3.0, chapter: 3.5, sentence: 0.7, clause: 0.2}
max_minutes: 13
length_reason: "the owner asked for the reason behind every step (reviews of 2026-10-21), which takes it past 10 minutes; for viewers watching alone, publish it in two parts (soil to the count table; depth and rarefaction)"
segments:
  # chapter 1: the soil (what is really there)
  - id: s1
    role: setting
    scene: Soil
    visual: "chapter title; a droplet of soil; the camera pushes in through a magnifying glass until bacterial cells (rods and cocci, several colours) fill the frame"
    onscreen: ""
    narration: "Take a pinch of soil. Look closer, and you find bacteria: a great many cells, of many different kinds."
    sync: {soil: "Take a pinch of soil"}
    claims: []
    verify: {inside_frame: all}
  - id: s2
    role: setting
    scene: Soil
    visual: "the camera pulls back; the cells gather into a labelled sample: 100,000 cells, 80 taxa"
    onscreen: "100,000 cells; 80 taxa"
    narration: "We can't see a real soil's true counts, so ours is simulated, small enough to draw. It holds 100,000 cells from 80 taxa: 80 kinds of bacteria."
    sync: {simulated: "so ours is simulated"}
    claims: [m1]
    verify: {inside_frame: all}
  - id: s3
    role: setting
    scene: Soil
    visual: "the cells sort themselves into bars, one per taxon, tallest first: a few tall coloured bars, a long low grey tail; the tall bars are labelled abundant, the tail low-abundance"
    onscreen: "cells per taxon; abundant; low-abundance; taxon 1; taxon 3"
    narration: "Count the cells of each taxon. A few taxa are abundant and hold most of the cells. Most are low-abundance: a long tail. We'll follow two: taxon 1, the most abundant, and taxon 3."
    sync: {count: "Count the cells"}
    claims: [m1, m2]
    verify: {inside_frame: all}
  - id: s3b
    role: setting
    scene: Soil
    visual: "beside the chart, a card is written in, labelled data: one global survey of soils, the dominant 2% of bacterial taxa, about 41% of an average sample's reads"
    onscreen: "sequences, real soils; 2% of taxa; 98% of taxa; 41%"
    narration: "Is that shape realistic? Surveys of soil DNA find the same long tail. In one global survey, just 2% of soil bacterial taxa made up about 41% of the sequences in an average sample."
    sync: {survey: "Surveys of soil DNA"}
    claims: [m31]
    verify: {inside_frame: all}
  - id: s4
    role: distil
    scene: Soil
    visual: "the chart holds; its title becomes 'the truth: cells per taxon'"
    onscreen: "target: cells per taxon"
    narration: "Those true counts are what we want to measure: how many cells of each taxon the soil holds."
    sync: {target: "Those true counts"}
    claims: []
    verify: {inside_frame: all}
  # chapter 2: from cells to gene copies
  - id: s5a
    role: mechanism
    scene: Genes
    question: "How do we count the cells of each taxon?"
    visual: "chapter title; a dozen cells of six taxa, drawn in their taxon colours, turn the same grey (how they look under a microscope); then a short DNA strand in its taxon colour appears inside each cell"
    onscreen: "telling taxa apart"
    narration: "But we can't count bacteria by eye: most look alike under a microscope. So we read their DNA instead, and first we extract it."
    sync: {alike: "But we can't count bacteria"}
    claims: [m39]
    verify: {inside_frame: all}
  - id: s5
    role: mechanism
    scene: Genes
    visual: "chapter title; cells and grey beads in a tube; the tube shakes; most cells split and spill wavy DNA strands"
    onscreen: "DNA extraction"
    narration: "Usually by bead-beating: shaking the soil with tiny beads, which break the cells open."
    sync: {beads: "Usually by bead-beating"}
    claims: [m3]
    verify: {inside_frame: all}
  - id: s6
    role: problem
    scene: Genes
    visual: "three thick-walled cells stay shut while the rest have opened; each is circled in turn"
    onscreen: "Gram-positive DNA; gentle; harder; +400%"
    narration: "But tough-walled cells break less often, and give up less DNA. In one study, harder shaking released up to 400% more DNA from thick-walled Gram-positive bacteria. So those taxa can start out undercounted."
    sync: {tough: "But tough-walled cells"}
    claims: [m3]
    verify: {inside_frame: all}
  - id: s7
    role: mechanism
    scene: Genes
    visual: "one opened cell's DNA straightens into a ring, its genome; an arc of the ring is drawn in, labelled 16S rRNA gene"
    onscreen: "16S rRNA gene; genome"
    narration: "Which part of all this DNA do we read? Whole genomes are more than we need. One gene every bacterium carries tells most of them apart: the 16S ribosomal RNA gene."
    sync: {which: "Which part of all this DNA"}
    claims: [m4]
    verify: {inside_frame: all}
  - id: s8
    role: mechanism
    scene: Genes
    visual: "the ring moves left and gains arcs one by one, seven in all (taxon 1); a second ring appears on the right with a single arc (taxon 3); a note below: 1 to about 15 copies, rarely more"
    onscreen: "copies per genome; 1; 15; taxon 1: 7 copies; taxon 3: 1 copy"
    narration: "So we'll count genes, not cells. But taxa carry different numbers of this gene: from 1 to about 15 per genome, rarely more. Taxon 1 carries 7; taxon 3, just 1."
    sync: {genes: "So we'll count genes"}
    claims: [m5, m6]
    verify: {inside_frame: all, no_overlap: [g1, g3]}
  - id: s9
    role: problem
    scene: Genes
    visual: "taxon 1's ring duplicates into two rings inside one cell outline, doubling its arcs; label: a growing cell, two genomes"
    onscreen: "one cell; 1 to dozens; ?"
    narration: "A cell can also hold several copies of its genome. In lab cultures, from one to dozens, by species and growth rate. In soil it is barely measured, so our simulation leaves it out."
    sync: {cell: "A cell can also hold", copies: "several copies of its genome"}
    claims: [m30]
    verify: {inside_frame: all}
  - id: s10
    role: distil
    scene: Genes
    visual: "the bar chart from chapter 1 returns and morphs twice: share of cells, then share of DNA, then share of 16S gene copies; taxon 1's bar is labelled before and after"
    onscreen: "share of 16S copies; taxon 1: 23%; taxon 1: 49.5%"
    narration: "So before anything is copied, the counts have already shifted. Taxon 1 has gone from 23% of the cells to 49.5% of the gene copies."
    sync: {shares: "So before anything is copied"}
    claims: [m11]
    verify: {inside_frame: all}
  # chapter 3: PCR
  - id: s11a
    role: mechanism
    scene: Amplify
    question: "How do we pick the 16S gene out of all that DNA, and get enough of it to read?"
    visual: "chapter title; a tangle of DNA strands from many cells; on some, a short coloured stretch lights up: the 16S gene; then the three taxa's 16S genes are drawn as bars one under another"
    onscreen: "all that DNA; PCR; 16S rRNA gene"
    narration: "We still have to pick the 16S gene out of all that DNA, and copy it enough to read. PCR does both. To aim it, look along the gene of three taxa."
    sync: {tangle: "We still have to pick"}
    claims: []
    verify: {inside_frame: all}
  - id: s11
    role: mechanism
    scene: Amplify
    visual: "step heading 'the 16S rRNA gene'; three copies of the gene, one per taxon, drawn as bars one under another; the conserved stretches are the same grey in all three and labelled conserved on them; the middle stretch is a different colour in each, labelled variable region"
    onscreen: "16S rRNA gene; conserved; variable region"
    narration: "Some stretches are conserved: much the same across bacteria. Others are variable: they differ from taxon to taxon."
    sync: {conserved: "Some stretches are conserved"}
    claims: [m7]
    verify: {inside_frame: all}
  - id: s11b
    role: mechanism
    scene: Amplify
    visual: "step heading 'PCR primers'; primer arrows land on the conserved stretches of all three genes at once; a brace over the variable region between them reads: barcode = a variable region of the 16S rRNA gene, here V4"
    onscreen: "primers; barcode; V4"
    narration: "Primers, short pieces of DNA that start the copying, bind to two conserved stretches. So one pair fits most bacteria. Between them sits a variable region, such as V4. That region is our barcode."
    sync: {primers: "Primers, short pieces"}
    claims: [m7, m32]
    verify: {inside_frame: all}
  - id: s12
    role: mechanism
    scene: Amplify
    visual: "step heading 'PCR'; the barcode of one gene is copied out of it: 1, 2, 4, 8, 16 strands, each new strand copied from an old one, every strand coloured by its taxon; a counter runs to cycle 35"
    onscreen: "barcode; cycle 35"
    narration: "PCR copies this barcode over and over. Each cycle can nearly double it. Two common protocols use 25 and 35 cycles; our simulation uses 35."
    sync: {pcr: "PCR copies this barcode"}
    claims: [m7, m8]
    verify: {inside_frame: all}
  - id: s13
    role: problem
    scene: Amplify
    visual: "step heading 'PCR bias'; two taxa's barcodes copied side by side, one column filling faster than the other; a data card: one study, lab-grown gut communities, 35 cycles, about 1 taxon in 5 more than fourfold off"
    onscreen: "PCR bias; 1 taxon in 5; over 4× off"
    narration: "But PCR doesn't copy every taxon equally well. We call this PCR bias. In one study of lab-grown gut communities, about 1 taxon in 5 came out off by more than fourfold after 35 cycles."
    sync: {race: "But PCR doesn't copy"}
    claims: [m9]
    verify: {inside_frame: all}
  - id: s13b
    role: problem
    scene: Amplify
    visual: "the axis is drawn first, ticks 1/16, 1/4, 1, 4, 16, with 'copied too few' to the left and 'copied too many' to the right; then 80 dots, one per taxon, drop and stack; dashed lines at 1/4 and 4; the dots beyond them are ringed and counted"
    onscreen: "PCR bias per taxon; fair; too many; too few; ringed: 15 of 80"
    narration: "Our simulation matches that. On the axis, 1 is fair, 4 is four times too many, a quarter four times too few. Each dot is a taxon; ringed ones are over fourfold off."
    sync: {sim: "Our simulation matches"}
    claims: [m10]
    verify: {inside_frame: all}
  - id: s14
    role: problem
    scene: Amplify
    visual: "the bar chart returns as share of gene copies and morphs into share of barcodes; taxon 1's and taxon 3's bars are marked"
    onscreen: "share of barcodes; taxon 1: 46%; taxon 3: 7.5% → 0.5%"
    narration: "Here is what that does to our soil's shares: each taxon's percentage of the barcodes. Taxon 1 now makes up 46%. Taxon 3 has fallen from 7.5% of the cells to half a percent."
    sync: {shares: "Here is what that does"}
    claims: [m11]
    verify: {inside_frame: all}
  - id: s14b
    role: distil
    scene: Amplify
    visual: "taxon 1's and taxon 3's bars lift out of the chart into a two-bar chart of their own; the ratio between them is written between the bars: 3 to 1 in cells; the bars change to gene copies, 53 to 1, then barcodes, 85 to 1, the ratio counting up with them"
    onscreen: "in cells; in barcodes; 3 to 1; 53 to 1; 85 to 1"
    narration: "So compare taxon 1 and taxon 3 directly. In the cells, taxon 1 outnumbered taxon 3 about 3 to 1. In the gene copies, 53 to 1. In the barcodes, about 85 to 1."
    sync: {compare: "So compare taxon 1"}
    claims: [m33]
    pause_after: 3.5
    verify: {inside_frame: all}
  # chapter 4: sequencing
  - id: s15
    role: mechanism
    question: "So far, one sample: how are many samples read?"
    scene: Sequence
    visual: "step heading 'samples'; the soil icon, a cell, its DNA strand and the barcode copies pass in a quick chain (the pictures from chapters 1 to 3) and the copies drop into tube A; tubes B and C fill the same way; each tube labelled sample A, B, C, with 'barcode copies, coloured by taxon'"
    onscreen: "soil; cell; DNA; barcode copies; sample A"
    narration: "So far we've followed one sample. A study compares many: each sample's DNA is extracted and PCR copies its barcode. Here are three from one soil, so differences come from the method, not the soil."
    sync: {one: "So far we've followed"}
    claims: []
    verify: {inside_frame: all}
  - id: s15b
    role: mechanism
    scene: Sequence
    visual: "step heading 'indexing'; a short white tag, one pattern per sample, is added to the left end of every barcode copy, tube by tube"
    onscreen: "indexing; index"
    narration: "One sequencing run can hold many samples. To tell them apart later, each sample's barcodes get a short tag, called an index. The barcode names the taxon; the index names the sample."
    sync: {run: "One sequencing run"}
    claims: [m12]
    verify: {inside_frame: all}
  - id: s16
    role: mechanism
    scene: Sequence
    visual: "step heading 'sequencing'; the tagged copies pour into one pool; reads leave the pool along curved paths into the sequencer, and as each arrives its sample's read meter grows a step"
    onscreen: "sequencer; pool; reads per sample"
    narration: "The samples are pooled. The pool holds far more barcode copies than the machine can read, so it reads a random draw. Each barcode it reads becomes a read: a string of DNA letters."
    sync: {pool: "The samples are pooled"}
    claims: [m13, m40]
    verify: {inside_frame: all}
  - id: s16b
    role: mechanism
    scene: Sequence
    visual: "one barcode drawn large beside the sequencer, read from both ends: two arrows, read 1 and read 2, labelled read pair; the overlap between them highlighted; more reads keep arriving and the meters keep growing"
    onscreen: "read pair; overlap"
    narration: "To catch errors, it reads each barcode from both ends, giving a read pair. Where the two reads overlap, they check each other."
    sync: {ends: "it reads each barcode from both ends"}
    claims: [m35, m41]
    verify: {inside_frame: all}
  - id: s17
    role: problem
    scene: Sequence
    visual: "the three read meters hold; the label 'sequencing depth' is written over them; sample C's short meter is circled"
    onscreen: "sequencing depth"
    narration: "Samples get unequal shares of that draw: pooling and DNA yields are uneven. The reads a sample gets are its sequencing depth. In one dataset, the deepest got nearly 100 times more than the shallowest."
    sync: {unequal: "Samples get unequal shares"}
    claims: [m13, m14, m42]
    verify: {inside_frame: all}
  - id: s18
    role: mechanism
    scene: Sequence
    visual: "step heading 'demultiplexing'; reads travel into three bins by their tag; one of sample A's reads lands in bin B and is circled"
    onscreen: "misassigned (exaggerated)"
    narration: "To use those depths, software sorts the reads back to their samples by index. A few land in the wrong sample, through index mix-ups or spillover between samples. In one 16S study, about 2% did."
    sync: {sort: "software sorts the reads"}
    claims: [m15]
    verify: {inside_frame: all}
  - id: s19
    role: distil
    scene: Sequence
    visual: "the three bins hold still; a pile beside each shows its size"
    onscreen: "reads"
    narration: "So each sample now has its own pile of reads, and each pile is a different size."
    sync: {piles: "its own pile of reads"}
    claims: []
    verify: {inside_frame: all}
  # chapter 5: from reads to a table
  - id: s20
    role: mechanism
    question: "What has to happen to the raw reads before we can count taxa?"
    scene: Reads
    visual: "step heading 'merging'; a read pair from chapter 4: the two arrows overlap in the middle of the barcode and join into one merged read"
    onscreen: "barcode copy; read 1; read 2; overlap; merged read"
    narration: "Before we can count taxa, the reads need cleaning. Each read pair is still two separate reads. They overlap in the middle of the barcode, so they're joined into one merged read."
    sync: {clean: "Before we can count taxa"}
    claims: [m16, m35]
    verify: {inside_frame: all}
  - id: s20b
    role: mechanism
    scene: Reads
    visual: "step heading 'filtering by length'; the three taxa's barcodes as bars, left-aligned, ending a few bases apart (ends exaggerated), lengths 251, 253, 255 at their ends; a band over the ends labelled 'expected length (V4)'"
    onscreen: "expected length; 251 bases; 253 bases; 255 bases"
    narration: "Faulty reads could pose as false taxa, so we filter them. One check is length. Each barcode has an expected length; taxa differ by a few bases, 251 to 255 in one V4 dataset."
    sync: {filter: "Faulty reads could pose"}
    claims: [m36]
    verify: {inside_frame: all}
  - id: s20c
    role: mechanism
    scene: Reads
    visual: "one read with a quality strip, bright at its start and fading toward its end; the faded end is cut off and the read is shorter (label 'trimmed: low quality'); then a gene with a primer landing in the wrong place makes a short off-colour copy, labelled 'off-target copy'"
    onscreen: "high quality; low; trimmed; other DNA; primer; off-target copies"
    narration: "Some reads come out short: on Illumina machines, quality tends to fall near a read's end, so we trim it. Primers that bind in the wrong place can make much shorter or longer copies."
    sync: {short: "Some reads come out short"}
    claims: [m37]
    verify: {inside_frame: all}
  - id: s20d
    role: mechanism
    scene: Reads
    visual: "a histogram of merged read lengths builds up (illustrative): a tall peak at the expected length, a tail of short reads to its left, a small off-target bump to its right; then the axis titles are written"
    onscreen: "expected length; short tail; off-target; read length (bases); number of reads"
    narration: "So read lengths spread out. In this histogram, most reads sit near the expected length, with a tail of short ones. Length runs along the bottom, and the number of reads up the side."
    sync: {spread: "So read lengths spread out"}
    claims: [m34]
    verify: {inside_frame: all}
  - id: s20e
    role: problem
    scene: Reads
    visual: "two cut-off lines are drawn either side of the peak; the bars outside dim, labelled dropped; the histogram shrinks to the top and three small histograms, samples A, B and C, get the same two lines; then the lower line slides into the peak (real reads dim: 'too strict: real reads lost') and back out past the tail ('too loose: faulty reads kept'), and settles"
    onscreen: "cut-offs; dropped; sample A; too strict; too loose"
    narration: "Where to set the cut-offs is a judgement, made from plots like this. Every sample usually gets the same ones, so all are treated alike. Too strict loses real reads; too loose keeps faulty ones."
    sync: {cut: "Where to set the cut-offs"}
    claims: [m16, m38]
    verify: {inside_frame: all}
  - id: s21
    role: mechanism
    scene: Reads
    visual: "seven near-identical sequences, error letters underlined, fold into one exact sequence labelled ASV"
    onscreen: "reads; ASV; ASVs, one soil dataset; Deblur 8,270; UNOISE3 11,613; DADA2 16,609"
    narration: "Reads that pass still carry the odd wrong letter, which could pose as a new taxon. Denoising folds them back into exact sequences, called ASVs. Pipelines disagree: one soil dataset gave 8,270 to 16,609 ASVs."
    sync: {errors: "Reads that pass"}
    claims: [m17]
    verify: {inside_frame: all}
  - id: s22
    role: problem
    scene: Reads
    visual: "a copy starts along a blue template and finishes along an orange one: a half-and-half chimera; a detector row crosses out some chimeras and misses others"
    onscreen: "chimera; detector"
    narration: "Some false sequences come from PCR instead: it can join two different barcodes into one, a chimera. In one test, 0.9% to 18.2% of reads were chimeras. Detectors catch many, not all."
    sync: {templates: "Some false sequences", join: "it can join two"}
    claims: [m18]
    verify: {inside_frame: all}
  - id: s23
    role: mechanism
    scene: Reads
    visual: "an ASV travels to a reference shelf, its best match lights up and names it; the reads are tallied into a table of taxa by samples, columns scaled to each sample's depth"
    onscreen: "reference database; best match; count table"
    narration: "An ASV is just a string of letters. To learn which bacterium it is, we match it to a reference database. Then the reads are counted into a table: taxa by samples."
    sync: {asv: "An ASV is just"}
    claims: [m19]
    verify: {inside_frame: all}
  - id: s24
    role: distil
    scene: Reads
    visual: "the table holds; its column heads read 'reads', not 'cells'"
    onscreen: "reads, not cells"
    narration: "So the table counts reads, not cells. To keep things simple, our simulation leaves out the errors and chimeras that slip through."
    sync: {reads: "So the table counts"}
    claims: [m20]
    verify: {inside_frame: all}
  # chapter 6: depth
  - id: s25
    role: problem
    question: "Samples get different depths: what does depth itself do to what we find?"
    scene: Depth
    visual: "chapter title; three detection strips for the simulated soil at 50,000, 5,000 and 500 reads, drawn in turn from the deepest; empty slots for taxa never drawn"
    onscreen: "50,000 reads; 78 taxa; 64 taxa; 42 taxa; found; missed"
    narration: "Remember the piles of different sizes? What does depth itself do? Sequence our one soil at three depths. At 50,000 reads, 78 of the 80 taxa turn up. At 5,000, 64. At 500, only 42."
    sync: {recall: "Remember the piles"}
    claims: [m21]
    verify: {inside_frame: all, no_overlap: all}
  - id: s26
    role: problem
    scene: Depth
    visual: "the empty slots in the 500-read strip are circled; their bars in the barcode chart are tiny"
    onscreen: "missed"
    narration: "The taxa we miss are the low-abundance ones. Their barcodes are so few that a small draw never picks them."
    sync: {miss: "The taxa we miss"}
    claims: [m21]
    verify: {inside_frame: all}
  - id: s27
    role: problem
    scene: Depth
    visual: "30 repeat sequencings at each depth, each a dot: taxon 1's dots sit tight on its 46%; a low-abundance taxon's dots scatter or sit at zero at 500 reads, narrowing with depth"
    onscreen: "taxon 1, abundant; taxon 41, low-abundance; dashed: pool share"
    narration: "One draw could be luck, so sequence each depth 30 times. Taxon 1 stays near 46% every time. A low-abundance taxon jumps around, or vanishes. In this model, more reads make a share more precise."
    sync: {repeat: "One draw could be luck"}
    claims: [m22]
    verify: {inside_frame: all}
  - id: s28
    role: distil
    scene: Depth
    visual: "the three strips return side by side; the counts 78, 64, 42 hold"
    onscreen: "taxa found; reads; 42; 64; 78"
    narration: "So a shallower sample finds fewer taxa, lower richness, even from the same soil."
    sync: {fewer: "So a shallower sample"}
    claims: []
    verify: {inside_frame: all}
  # chapter 7: rarefaction
  - id: s29
    role: problem
    question: "How can two samples of different depth be compared?"
    scene: Rarefy
    visual: "chapter title; two samples from the same soil, deep and shallow, white strips with their counts"
    onscreen: "richness = taxa found; 78 taxa; 56 taxa"
    narration: "That's a problem when we compare samples. Take two from the same soil: one got 50,000 reads and shows 78 taxa; the other got 2,000 and shows 56."
    sync: {problem: "That's a problem"}
    claims: [m23]
    verify: {inside_frame: all, no_overlap: all}
  - id: s30
    role: resolution
    scene: Rarefy
    visual: "the deep sample's strip thins: reads are drawn out at random down to 2,000, and the rest slide away"
    onscreen: "deep, rarefied: 2,000 reads; 48,000 reads set aside"
    narration: "One fix is to bring both to the same depth: the shallow sample's 2,000 reads. Rarefying picks 2,000 of the deep sample's reads at random, and sets the other 48,000 aside."
    sync: {fix: "One fix is to bring"}
    claims: [m24, m26]
    verify: {inside_frame: all}
  - id: s31
    role: resolution
    scene: Rarefy
    visual: "the draw repeats; each result drops into a histogram of 200; the band of the middle 95% and the shallow sample's 56 are marked"
    onscreen: "200 draws; average 57; middle 95%: 52 to 61; shallow sample: 56"
    narration: "One pick could be lucky, so we repeat it 200 times. On average it finds 57 taxa; 95% of picks land between 52 and 61. The shallow sample's 56 sits inside: they agree."
    sync: {lucky: "One pick could be lucky", repeat: "we repeat it 200 times"}
    claims: [m24, m25]
    pause_after: 2.5
    verify: {inside_frame: all, no_overlap: all}
  - id: s32
    role: limits
    scene: Rarefy
    visual: "the barcode chart returns, an arrow at taxon 1: bias, still in every read; beside it the shallow sample's strip, its empty slots pulsing: missed taxa, still missed"
    onscreen: "still biased; still missing"
    narration: "But that agreement is about depth only: rarefying evens out depth, and nothing else. The biases from extraction, copy number and PCR are in every read. Taxa the shallow sample missed are still missing."
    sync: {only: "But that agreement"}
    claims: [m26]
    verify: {inside_frame: all}
  - id: s33
    role: limits
    scene: Rarefy
    visual: "two soils, one crowded with cells and one sparse, each give the same share chart: same shares; label: total cells, measured by spike-ins or cell counts"
    onscreen: "many cells; few cells; same shares"
