# Metabarcoding exemplar (tier 4). Counts come from pipeline.py (seed 7), a simulation; the literature
# claims cite their sources, taken from the MB-01 literature review (vault Topics/Biology/Research/Results).
claims:
- id: m1
  text: a simulated community of 100,000 cells from 80 taxa
  source: 'pipeline.py: N_TAXA = 80, CELLS = 100_000; lognormal abundances, sigma 2.0'
  kind: illustrative
  value: 100000 80
- id: m2
  text: in the simulated soil a few taxa are abundant and hold most of the cells, and most taxa are present at low abundance (the most abundant is 23% of cells)
  source: 'pipeline.py data() (run pipeline.py to print it); seed 7: cells[0] = 23,000 of 100,000'
  kind: derived
  value: 23
  unit: '%'
- id: m3
  text: DNA is extracted by breaking cells open, often by bead beating; tougher cells give up less DNA; in one study harder bead beating raised Gram-positive DNA by up to 400%
  source: 'Albertsen, M., Karst, S. M., Ziegler, A. S., Kirkegaard, R. H. and Nielsen, P. H. (2015) Back to basics: the influence of DNA extraction and primer choice on phylogenetic analysis of activated sludge communities. PLOS ONE 10(7): e0132783, doi:10.1371/journal.pone.0132783 (activated sludge)'
  kind: quoted
  value: 400
  unit: '%'
- id: m4
  text: the 16S ribosomal RNA gene is read as a marker for which bacteria are present
  source: 'Caporaso, J. G. et al. (2011) Global patterns of 16S rRNA diversity at a depth of millions of sequences per sample. PNAS 108(Suppl 1): 4516-4522, doi:10.1073/pnas.1000080107'
  kind: quoted
- id: m5
  text: a genome carries from 1 to about 15 copies of the 16S rRNA gene, rarely more, depending on the taxon
  source: 'Stoddard, S. F., Smith, B. J., Hein, R., Roller, B. R. K. and Schmidt, T. M. (2015) rrnDB: improved tools for interpreting rRNA gene abundance in bacteria and archaea and a new foundation for future development. Nucleic Acids Research 43(D1): D593-D598, doi:10.1093/nar/gku1201 (bacteria 1 to 15); Vetrovsky, T. and Baldrian, P. (2013) The variability of the 16S rRNA gene in bacterial genomes and its consequences for bacterial community analyses. PLoS ONE 8(2): e57923, doi:10.1371/journal.pone.0057923 (1,690 genomes, mean 4.2); rarely more: MB-02 review (vault Topics/Biology/Research/Results), rrnDB v5.6 and v5.10 release files list maxima of 21 and 22 (reviewer derivation, not checked against assembly quality)'
  kind: quoted
  value: 1 15
- id: m6
  text: in the simulated community the commonest taxon carries 7 copies and taxon 3 carries 1
  source: 'pipeline.py data(); seed 7: copies[0] = 7, copies[2] = 1 (copies drawn from 1 to 15, one copy commonest)'
  kind: illustrative
  value: 7 1 3
- id: m7
  text: along the 16S rRNA gene, conserved stretches are much the same across bacteria and variable regions differ between taxa; primers bind two conserved stretches, so one pair fits most bacteria (no pair fits all; the best broad pair matched about 86% of bacteria exactly, 94.5% with one mismatch), and PCR copies the variable region between them (the barcode); each cycle can nearly double it
  source: 'conserved and variable regions: Illumina, Inc. 16S Metagenomic Sequencing Library Preparation, Part 15044223 Rev. B ("nine variable regions interspersed between conserved regions"); primer coverage: Klindworth, A., Pruesse, E., Schweer, T., Peplies, J., Quast, C., Horn, M. and Glöckner, F. O. (2013) Evaluation of general 16S ribosomal RNA gene PCR primers for classical and next-generation sequencing-based diversity studies. Nucleic Acids Research 41(1): e1, doi:10.1093/nar/gks808; per-cycle amplification, each template multiplied by (1 + efficiency) each cycle, efficiency at most 1: Kelly, R. P., Shelton, A. O. and Gallego, R. (2019) Understanding PCR processes to draw meaningful conclusions from environmental DNA studies. Scientific Reports 9: 12133, doi:10.1038/s41598-019-48546-x (eDNA; the PCR model is general)'
  kind: quoted
- id: m8
  text: two widely used 16S amplicon protocols use 25 and 35 PCR cycles (Illumina's two-step guide 25 amplicon cycles plus 8 index cycles; the Earth Microbiome Project 35); the simulation uses 35
  source: 'Illumina, Inc. 16S Metagenomic Sequencing Library Preparation, Part 15044223 Rev. B (documentation); Earth Microbiome Project, 16S Illumina Amplicon Protocol, https://earthmicrobiome.org/protocols-and-standards/16s/ ; pipeline.py CYCLES = 35'
  kind: quoted
  value: 25 35 8
- id: m9
  text: in one study, after 35 PCR cycles about 1 taxon in 5 (19%) in lab-grown gut communities came out more than fourfold off (relative to a model-inferred cycle 0); in that study's 10-strain mock community the average bias was 2.6-fold
  source: 'Silverman, J. D., Bloom, R. J., Jiang, S., Durand, H. K., Dallow, E., Mukherjee, S. and David, L. A. (2021) Measuring and mitigating PCR bias in microbiota datasets. PLOS Computational Biology 17(7): e1009113, doi:10.1371/journal.pcbi.1009113 (single study; relative bias inferred from log-ratio slopes across cycle numbers)'
  kind: quoted
  value: 35 1 5 19 2.6
- id: m10
  text: the simulation is set to match that share; 15 of its 80 taxa end more than fourfold off after 35 cycles
  source: 'pipeline.py PCR_SD = 1.06 (sd of ln fold bias; P(|ln b| > ln 4) = 0.19); seed 7: 15 of 80 beyond fourfold'
  kind: derived
  value: 15 80 35
- id: m11
  text: in the simulation, extraction, copy number and PCR each reshape the shares; taxon 1 goes from 23% of cells to 49.5% of 16S gene copies and 46% of barcodes, and taxon 3 falls from 7.5% of cells to 0.5% (half a percent) of barcodes
  source: 'pipeline.py stages(); seed 7: taxon 1 true 0.230, dna 0.314, templates 0.495, pool 0.458; taxon 3 true 0.075, dna 0.042, templates 0.009, pool 0.005'
  kind: derived
  value: 23 49.5 46 1 3 7.5 0.5
- id: m12
  text: each sample's amplicons get a short index sequence naming the sample, and many samples are pooled and sequenced together in one run
  source: 'Illumina, Inc. 16S Metagenomic Sequencing Library Preparation, Part 15044223 Rev. B (index PCR, then pooling); Kozich, J. J., Westcott, S. L., Baxter, N. T., Highlander, S. K. and Schloss, P. D. (2013) Development of a dual-index sequencing strategy and curation pipeline for analyzing amplicon sequence data on the MiSeq Illumina sequencing platform. Applied and Environmental Microbiology 79(17): 5112-5120, doi:10.1128/AEM.01043-13'
  kind: quoted
- id: m13
  text: the sequencer reads a random sample of the pooled barcodes; the number of reads a sample gets is its sequencing depth
  source: 'model: reads are a multinomial draw from the amplicon pool (pipeline.py sequence())'
  kind: illustrative
- id: m14
  text: depths differ between samples; within one study the deepest sample had nearly 100 times the reads of the shallowest
  source: 'Schloss, P. D. (2024b) Rarefaction is currently the best approach to control for uneven sequencing effort in amplicon sequence analyses. mSphere 9(2): e00354-23, doi:10.1128/msphere.00354-23 (bioethanol dataset: 3,690 to 356,027 reads per sample, 96-fold; other datasets about 1.3- to 69-fold)'
  kind: derived
  value: 100
- id: m15
  text: demultiplexing sorts reads back to samples by index; a few can land in the wrong sample, about 2% of reads in one 16S study and negligibly few in another
  source: 'Edgar, R. C. (2016a) UNCROSS: filtering of high-frequency cross-talk in 16S amplicon reads. bioRxiv 088666, doi:10.1101/088666 (preprint; about 2%); Minich, J. J., Sanders, J. G., Amir, A., Humphrey, G., Gilbert, J. A. and Knight, R. (2019) Quantifying and understanding well-to-well contamination in microbiome research. mSystems 4(4): e00186-19, doi:10.1128/mSystems.00186-19 (barcode leakage negligible)'
  kind: quoted
  value: 2
  unit: '%'
- id: m16
  text: the two reads from each end of a fragment are merged and low-quality or short reads are dropped; how strict the filtering is changes the diversity found
  source: 'Bokulich, N. A., Subramanian, S., Faith, J. J., Gevers, D., Gordon, J. I., Knight, R., Mills, D. A. and Caporaso, J. G. (2013) Quality-filtering vastly improves diversity estimates from Illumina amplicon sequencing. Nature Methods 10(1): 57-59, doi:10.1038/nmeth.2276; paired-end reads: Illumina 16S guide, as m8'
  kind: quoted
- id: m17
  text: sequencing errors make near-copies of each real sequence; denoising folds them into exact sequence variants (ASVs), while older pipelines cluster at 97% similarity into OTUs; in one soil dataset, pipelines found 8,270 (Deblur), 11,613 (UNOISE3) and 16,609 (DADA2) ASVs
  source: 'Nearing, J. T., Douglas, G. M., Comeau, A. M. and Langille, M. G. I. (2018) Denoising the Denoisers: an independent evaluation of microbiome sequence error-correction approaches. PeerJ 6: e5364, doi:10.7717/peerj.5364 (one soil dataset, blueberry fields: Deblur 8,270, UNOISE3 11,613, DADA2 16,609 ASVs; open-reference 21,297 OTUs); Callahan, B. J., McMurdie, P. J., Rosen, M. J., Han, A. W., Johnson, A. J. A. and Holmes, S. P. (2016) DADA2: High-resolution sample inference from Illumina amplicon data. Nature Methods 13(7): 581-583, doi:10.1038/nmeth.3869 (97% OTUs)'
  kind: quoted
  value: 97 8270 11613 16609
- id: m18
  text: PCR joins pieces of two templates into chimeras; in one test at 30 cycles, 0.9% to 18.2% of reads were chimeric depending on the polymerase, and detection caught many but not all
  source: 'Sze, M. A. and Schloss, P. D. (2019) The impact of DNA polymerase and number of rounds of amplification in PCR on 16S rRNA gene sequence data. mSphere 4(3): e00163-19, doi:10.1128/mSphere.00163-19 (UCHIME sensitivity 50 to 87% at 25 or more cycles)'
  kind: quoted
  value: 30 0.9 18.2
- id: m19
  text: each ASV is named by a classifier that compares it with a reference database, and reads are counted into a table of taxa by samples
  source: 'Bokulich, N. A., Kaehler, B. D., Rideout, J. R., Dillon, M., Bolyen, E., Knight, R., Huttley, G. A. and Caporaso, J. G. (2018) Optimizing taxonomic classification of marker-gene amplicon sequences with QIIME 2''s q2-feature-classifier plugin. Microbiome 6: 90, doi:10.1186/s40168-018-0470-z'
  kind: quoted
- id: m20
  text: the simulation leaves out the false taxa these steps add (chimeras, misassigned reads, sequencing errors, spurious ASVs)
  source: 'pipeline.py docstring, "Left out on purpose"'
  kind: illustrative
- id: m21
  text: 78 of the 80 taxa are found at 50,000 reads, 64 at 5,000 and 42 at 500
  source: 'pipeline.py data(); seed 7: observed(runs[d]) for d in 500, 5,000, 50,000'
  kind: derived
  value: 78 80 64 42 500 5000 50000
- id: m22
  text: in 30 repeat sequencings at each depth, the top taxon's share stays near its 46% of the pool while a rare taxon's share scatters or drops to zero at low depth; in this model depth changes the precision of a share, not its expected value
  source: 'pipeline.py: pool[0] = 0.458; repeats drawn in scene.py Depth (binomial(depth, pool share) / depth, 30 per depth); a multinomial draw is unbiased for each pool share'
  kind: derived
  value: 30 46
- id: m23
  text: 'two samples from the same soil: 50,000 reads show 78 taxa, 2,000 reads show 56'
  source: 'pipeline.py data(); seed 7: obs_deep = 78 (DEEP = 50,000), obs_shallow = 56 (SHALLOW = 2,000)'
  kind: derived
  value: 50000 78 2000 56
- id: m24
  text: rarefied to 2,000 reads 200 times, the deep sample finds 57 taxa on average, the middle 95% from 52 to 61; the shallow sample's 56 sits inside
  source: 'pipeline.py data(): rare_mean = 56.9, percentiles 51.975 and 61 rounded to 52 and 61, DRAWS = 200'
  kind: derived
  value: 2000 200 57 95 52 61 56
- id: m25
  text: rarefying draws one random subsample to a common depth; one subsample adds noise that grows as the depth shrinks, so rarefaction repeats it and averages; in null-model simulations rarefaction removed the link between richness and depth; it estimates the taxa expected in a subsample of the smaller size
  source: 'Schloss (2024b), as m14 ("Rarefaction eliminates the correlation between sequencing depth and alpha diversity"); Cameron, E. S., Schmidt, P. J., Tremblay, B. J.-M., Emelko, M. B. and Müller, K. M. (2021) Enhancing diversity analysis by repeatedly rarefying next generation sequencing data describing microbial communities. Scientific Reports 11: 22302, doi:10.1038/s41598-021-01636-1 (variance of a single rarefied subsample); Hurlbert, S. H. (1971) The nonconcept of species diversity: a critique and alternative parameters. Ecology 52(4): 577-586, doi:10.2307/1934145; Gotelli, N. J. and Colwell, R. K. (2001) Quantifying biodiversity: procedures and pitfalls in the measurement and comparison of species richness. Ecology Letters 4: 379-391, doi:10.1046/j.1461-0248.2001.00230.x'
  kind: quoted
- id: m26
  text: rarefying the deep sample to 2,000 reads sets aside 48,000 of its 50,000 reads; it does not remove extraction, copy-number or PCR bias, and does not recover taxa a shallow sample missed
  source: 'derived: 50000 - 2000; the subsample is drawn from reads that already carry the bias (pipeline.py rarefy()); McLaren, M. R., Willis, A. D. and Callahan, B. J. (2019) Consistent and correctable bias in metagenomic sequencing experiments. eLife 8: e46923, doi:10.7554/eLife.46923 (bias acts on every read, before sequencing)'
  kind: derived
  value: 48000
- id: m27
  text: the bias, or at least its effect on each taxon's share, can differ between samples
  source: 'Sze and Schloss (2019), as m18 (effect of cycle number "inconsistent" between human stool samples); McLaren et al. (2019), as m26 (errors in proportions varied in magnitude and direction between samples, though ratios were consistent in one 7-taxon dataset); Parada, A. E., Needham, D. M. and Fuhrman, J. A. (2016) Every base matters. Environmental Microbiology 18(5): 1403-1414, doi:10.1111/1462-2920.13023 (abstract only: SAR11 bias about 2-fold in mocks, 4 to 10-fold in field samples, primers 515F-Y/806R)'
  kind: quoted
- id: m28
  text: whether to rarefy is still argued, and the answer differs for richness (alpha diversity), for differences between samples (beta diversity) and for tests of single taxa (differential abundance)
  source: 'McMurdie, P. J. and Holmes, S. (2014) Waste not, want not: why rarefying microbiome data is inadmissible. PLOS Computational Biology 10(4): e1003531, doi:10.1371/journal.pcbi.1003531; Schloss, P. D. (2024a) Waste not, want not: revisiting the analysis that called into question the practice of rarefaction. mSphere 9(1): e00355-23, doi:10.1128/msphere.00355-23; Schloss (2024b), as m14; Weiss, S. et al. (2017) Normalization and microbial differential abundance strategies depend upon data characteristics. Microbiome 5: 27, doi:10.1186/s40168-017-0237-y; Willis, A. D. (2019) Rarefaction, alpha diversity, and statistics. Frontiers in Microbiology 10: 2407, doi:10.3389/fmicb.2019.02407'
  kind: quoted
- id: m29
  text: shares (relative abundances) cannot show total microbial load; measuring it takes spike-ins or cell counts (flow cytometry)
  source: 'Vandeputte, D. et al. (2017) Quantitative microbiome profiling links gut community variation to microbial load. Nature 551(7681): 507-511, doi:10.1038/nature24460 (abstract only; load by flow cytometry cell counts); Tkacz, A., Hortala, M. and Poole, P. S. (2018) Absolute quantitation of microbiota abundance in environmental samples. Microbiome 6: 110, doi:10.1186/s40168-018-0491-7 (soil, spike-ins)'
  kind: quoted
- id: m30
  text: a cell can hold several copies of its genome; in lab cultures, from one to dozens or more, depending on the species and how fast it grows; in soil, genome copies per cell have barely been measured
  source: 'Pecoraro, V., Zerulla, K., Lange, C. and Soppa, J. (2011) Quantification of ploidy in proteobacteria revealed the existence of monoploid, (mero-)oligoploid and polyploid species. PLoS ONE 6(1): e16392, doi:10.1371/journal.pone.0016392 (Caulobacter about 2.1 and Wolinella about 0.9 genome equivalents; E. coli 6.8 origins in fast growth; Pseudomonas putida about 20; Table 5: Azotobacter vinelandii about 40 in fast growth, from another laboratory; a methanogen with about 50 genome copies); soil: MB-02 review found indirect soil evidence only (DNA mass per cell), no taxon-level measurement'
  kind: quoted
- id: m31
  text: in one global survey of soils, the dominant 2% of bacterial phylotypes (chosen for being both abundant and widespread) made up about 41% of the reads in an average sample
  source: 'Delgado-Baquerizo, M., Oliverio, A. M., Brewer, T. E., Benavent-Gonzalez, A., Eldridge, D. J., Bardgett, R. D., Maestre, F. T., Singh, B. K. and Fierer, N. (2018) A global atlas of the dominant bacteria found in soil. Science 359(6373): 320-325, doi:10.1126/science.aap9516'
  kind: quoted
  value: 2 41 98
- id: m32
  text: one widely used choice of variable region is V4, which the Earth Microbiome Project protocol amplifies (primers 515F and 806R); Illumina's 16S guide uses V3-V4
  source: 'Earth Microbiome Project, 16S Illumina Amplicon Protocol, https://earthmicrobiome.org/protocols-and-standards/16s/ ; Caporaso, J. G. et al. (2011) Global patterns of 16S rRNA diversity at a depth of millions of sequences per sample. PNAS 108(Suppl 1): 4516-4522, doi:10.1073/pnas.1000080107 (V4)'
  kind: quoted
  value: 4
- id: m33
  text: in the simulation, taxon 1 outnumbers taxon 3 about 3 to 1 in cells, 53 to 1 in 16S gene copies and about 85 to 1 in barcodes
  source: 'pipeline.py data(), seed 7: true 0.230 / 0.0748 = 3.08; templates 0.4946 / 0.00936 = 52.9; pool 0.4576 / 0.00540 = 84.8'
  kind: derived
  value: 1 3 53 85
- id: m34
  text: an illustrative histogram of merged read lengths, most near the expected length (about 253 bases) with a tail of short reads and a small off-target bump of longer ones; cut-off lines either side of the peak
  source: 'scene.py Reads s20d-s20e (illustrative values, labelled illustrative on screen)'
  kind: illustrative
  value: 150 200 250 300
- id: m35
  text: the sequencer reads each barcode from both ends, giving a read pair; for a short amplicon the two reads overlap in the middle and are joined into one merged read
  source: 'Illumina, Inc. 16S Metagenomic Sequencing Library Preparation, Part 15044223 Rev. B (paired-end reads, 2 x 300, overlapping across the amplicon); Kozich, J. J., Westcott, S. L., Baxter, N. T., Highlander, S. K. and Schloss, P. D. (2013) Applied and Environmental Microbiology 79(17): 5112-5120, doi:10.1128/AEM.01043-13 (fully overlapping V4 read pairs)'
  kind: quoted
- id: m36
  text: each barcode has an expected length and taxa differ by a few bases (inferred from the source's allowance for biological length variation); in one V4 dataset the distinct sequences (ASVs, not reads) ran from 251 to 255 bases (most 253)
  source: 'Callahan, B. J. DADA2 Pipeline Tutorial (1.16), https://benjjneb.github.io/dada2/tutorial.html, accessed 2026-10-21: 2x250 MiSeq data of the V4 region (mothur MiSeq SOP data); table(nchar(getSequences(seqtab))) gives 251: 1, 252: 88, 253: 196, 254: 6, 255: 2 ASVs; "the lengths of our merged sequences all fall within the expected range for this V4 amplicon"; reads must overlap by "20 + biological.length.variation" nucleotides'
  kind: quoted
  value: 251 253 255
- id: m37
  text: on Illumina machines read quality tends to fall toward the end of a read, and per-read quality trimming cuts that end off, so some reads come out shorter; primers that bind in the wrong place (non-specific priming) can make sequences much shorter or longer than expected
  source: 'DADA2 Pipeline Tutorial (as m36): "The reverse reads are of significantly worse quality, especially at the end, which is common in Illumina sequencing"; "truncate the reverse reads at position 160 where the quality distribution crashes"; "Sequences that are much longer or shorter than expected may be the result of non-specific priming". Bokulich et al. 2013 (as m16): reads truncated at runs of low-quality base calls, then dropped if less than a set fraction of their length remains'
  kind: quoted
- id: m38
  text: where to set the length and quality cut-offs is a judgement made by inspecting quality and length plots; one set of cut-offs is usually applied to every sample in a study (shown in practice, not stated as a rule); too strict loses real reads, too loose keeps faulty ones, and the choice changes the diversity found
  source: 'DADA2 Pipeline Tutorial (as m36): "The standard filtering parameters are starting points, not set in stone"; truncation positions chosen from the quality profiles; one filterAndTrim call with one truncLen for all samples (derived); removing non-target lengths "is analogous to cutting a band in-silico". Bokulich et al. 2013 (as m16): quality threshold and minimum read length strongly affected diversity and composition on mock communities; stringency disputed (Kopylova et al. 2016, mSystems 1(1): e00003-15, doi:10.1128/mSystems.00003-15)'
  kind: derived
