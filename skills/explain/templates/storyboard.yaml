title: "{{TITLE}}"
message: "One sentence the reader should be able to repeat."
audience: "who, and what they already know"
delivery: read            # read (self-paced) | presented (system-paced, narrated)
tier: {{TIER}}
tier_reason: ""           # why the tier below would not carry the message (required above tier 0)
voice: {{VOICE}}          # tier 2: narrate the deck with Kokoro
numbers_ok: []            # incidental numbers that need no claim (figure numbers, citation years)
# tier 3 only:
# default_view: "what the page shows before anyone touches it, and why that alone carries the message"
# controls: 1             # sliders + buttons on the page; at most 2

# Token pass (before any code): edit tokens.json. 4-6 colours, one accent, typefaces, a layout concept.

segments:                 # tier 0-1: optional (the page's sections); tier 2-4: required
  - id: s1
    role: setting         # setting | mechanism | problem | resolution | limits; open with the setting
    visual: "what is drawn"
    onscreen: "at most 12 words"
    narration: "at most 35 words, said while the visual is on screen"
    claims: [c1]
    # tier 2:  step: "0.0.-1"      (slide h, vertical v, fragment f; -1 before the first fragment)
    # tier 4:  scene: Scene1
    #          anchors: {tree: B1, label: E4}     (cells A1..F4, A1 top left)
    #          verify: {inside_frame: all, no_overlap: all, order: [tree, label], hold_min_s: 2}
